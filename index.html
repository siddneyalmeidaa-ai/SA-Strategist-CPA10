<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A. SUPREMACIA v7.0 - CORPO DIRETO</title>
    <style>
        :root { --blue: #00d9ff; --green: #39ff14; --alert: #ffea00; --red: #ff003c; --bg: #000; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #ccc; font-family: 'Consolas', monospace; display: flex; height: 100vh; }
        .sidebar { width: 300px; border-right: 2px solid var(--blue); padding: 15px; overflow-y: auto; background: #050505; }
        .sidebar h2 { color: var(--blue); font-size: 1rem; text-align: center; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .nav-title { color: var(--red); font-size: 0.7rem; font-weight: bold; margin: 15px 0 5px; text-transform: uppercase; }
        .nav-btn { display: block; padding: 8px; color: #555; text-decoration: none; font-size: 0.8rem; border-left: 2px solid transparent; cursor: pointer; }
        .nav-btn:hover, .nav-btn.active { color: var(--blue); border-left-color: var(--blue); background: rgba(0, 217, 255, 0.05); }
        .main { flex: 1; padding: 40px; overflow-y: auto; background: radial-gradient(circle at top, #0a0a0a, #000); }
        .page { display: none; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .tag { background: var(--red); color: #fff; padding: 2px 8px; font-size: 0.7rem; font-weight: bold; }
        h1 { color: #fff; font-size: 2.5rem; margin: 10px 0 20px; text-transform: uppercase; border-left: 5px solid var(--blue); padding-left: 15px; }
        .box { background: #080808; border: 1px solid #1a1a1a; padding: 20px; margin: 20px 0; border-radius: 4px; }
        b { color: var(--alert); }
        .multa { border: 2px solid var(--red); padding: 20px; text-align: center; color: var(--red); font-weight: bold; margin: 20px 0; }
        .multa span { font-size: 2rem; display: block; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>SIDNEY ROOT S.A.</h2>
        <div class="nav-title">Módulo 1: SFN</div>
        <div id="m1-links"></div>
        <div class="nav-title">Módulo 2: Ética</div>
        <div id="m2-links"></div>
    </div>
    <div class="main" id="content-area"></div>

<script>
    const m1Data = [
        { t: "SFN: Estrutura", c: "O SFN é dividido em Normativos, Supervisores e Operadores. Regra de ouro: Conselhos mandam, Autarquias fiscalizam." },
        { t: "CMN: Poder Máximo", c: "Conselho Monetário Nacional. Composição: Fazenda, Planejamento e Pres. BACEN. Fixa a Meta da Inflação." },
        { t: "BACEN: Autonomia", c: "Executa a Política Monetária. Autônomo desde 2021. Presidente tem mandato fixo de 4 anos." },
        { t: "CVM: Mercado de Valores", c: "Fiscaliza o mercado de capitais (ações/fundos). Protege o investidor de fraudes e manipulação." },
        { t: "SELIC: Títulos Públicos", c: "Sistema de custódia para títulos federais. Gerido pelo BACEN. Liquidação em tempo real." },
        { t: "B3: Mercado Privado", c: "Bolsa brasileira. Liquida títulos privados (CDB/LCI) e ações. Lucrativa e privada." },
        { t: "ANBIMA: Autorregulação", c: "Associação privada. Cria códigos de conduta. Certificação obrigatória para quem atua." },
        { t: "Bancos Múltiplos", c: "Mínimo de 2 carteiras. Comercial ou de Investimento é obrigatório. Um só CNPJ." },
        { t: "Corretoras/Distribuidoras", c: "Intermediação. Funções unificadas hoje. Devem ser autorizadas pelo BACEN/CVM." },
        { t: "Investidores Qualificados", c: "R$ 1 milhão investidos + termo assinado. Conhecem o risco do mercado." },
        { t: "Investidores Profissionais", c: "R$ 10 milhões investidos. Conhecimento técnico avançado. Instituições financeiras." },
        { t: "Política Monetária", c: "COPON define a SELIC META a cada 45 dias. Ferramenta para bater a meta do CMN." },
        { t: "Política Fiscal", c: "Controle de gastos do governo. Superávit é quando sobra, Déficit é quando falta." },
        { t: "Câmbio: Dirty Float", c: "Flutuação suja. O mercado dita o preço do dólar, mas o BACEN intervém se necessário." },
        { t: "Redesconto", c: "Empréstimo do BACEN para bancos. Juros altos servem para tirar liquidez do mercado." },
        { t: "Compulsório", c: "Reserva obrigatória no BACEN. Controla a capacidade de empréstimo dos bancos." },
        { t: "Open Market", c: "Compra/venda de títulos pelo BACEN para ajustar a taxa de juros diária (Selic Efetiva)." },
        { t: "CNSP", c: "Conselho Nacional de Seguros Privados. O normativo do mercado de seguros e previdência aberta." },
        { t: "SUSEP", c: "Fiscaliza seguradoras e planos de previdência VGBL/PGBL. Executa ordens do CNSP." },
        { t: "PREVIC", c: "Supervisora de fundos de pensão (Previdência Fechada). Autarquia vinculada à Previdência." }
    ];

    const m2Data = [
        { t: "Lavagem: Lei 9.613", c: "Ocultar/dissimular origem de bens ilícitos. Reclusão de 3 a 10 anos + multa." },
        { t: "Fase 1: Colocação", c: "Placement. Entrada do dinheiro sujo no banco. Fase de maior perigo para o lavador." },
        { t: "Fase 2: Ocultação", c: "Layering. Camadas de transferências para quebrar o rastro. Uso de offshores." },
        { t: "Fase 3: Integração", c: "Integration. Dinheiro volta limpo via negócios legítimos ou compra de ativos." },
        { t: "Multa de Lavagem", c: "Teto administrativo de R$ 20.000.000,00 ou o dobro do lucro/operação." },
        { t: "COAF (UIF)", c: "Inteligência financeira. Analisa denúncias. Comunicação suspeita em 24h sem avisar o cliente." },
        { t: "Know Your Customer (KYC)", c: "Dever de conhecer o cliente, origem da renda e patrimônio. Atualização constante." },
        { t: "API: Suitability", c: "Perfil do investidor. Obrigatório antes de investir. Conservador, Moderado ou Arrojado." },
        { t: "Insider Trading", c: "Uso de info privilegiada. Crime federal. Prisão e multa de até 3x o lucro obtido." },
        { t: "Front Running", c: "Operar na frente da ordem do cliente para lucrar com a oscilação. Falta de ética grave." },
        { t: "PPE (Políticos)", c: "Vigilância especial para políticos e familiares por até 5 anos após sair do cargo." },
        { t: "Churning", c: "Giro excessivo de carteira para gerar comissão. Prejudica o cliente e viola a ética." },
        { t: "Sigilo Bancário", c: "Quebra só com ordem judicial. Dados são sigilosos, mas o COAF tem acesso via lei." },
        { t: "Misselling", c: "Venda inadequada de produtos (ex: empurrar capitalização como investimento)." },
        { t: "Código ANBIMA", c: "Transparência total. Tratar todos os clientes de forma igualitária e justa." },
        { t: "Inabilitação", c: "Pena administrativa que proíbe o gestor de atuar por até 20 anos no mercado." },
        { t: "Delação Premiada", c: "Redução de pena de até 2/3 para quem ajuda a desbaratar a quadrilha de lavagem." },
        { t: "Comunicação BACEN", c: "Depósitos em dinheiro vivo de R$ 50 mil ou mais são informados automaticamente." },
        { t: "Guarda de Documentos", c: "Registros e cadastros devem ser mantidos por 10 anos no mínimo." },
        { t: "Chinese Wall", c: "Segregação de funções. Gestão de recursos não pode se misturar com corretagem." }
    ];

    const viewer = document.getElementById('content-area');
    const l1 = document.getElementById('m1-links');
    const l2 = document.getElementById('m2-links');

    function load() {
        m1Data.forEach((d, i) => {
            l1.innerHTML += `<div class="nav-btn" onclick="pg('m1-${i}')">Pág ${i+1}: ${d.t}</div>`;
            viewer.innerHTML += `<div id="m1-${i}" class="page">
                <span class="tag">M1: PÁGINA ${i+1}/20</span>
                <h1>${d.t}</h1>
                <div class="box"><b>RELATÓRIO ROOT:</b><br><br>${d.c}</div>
            </div>`;
        });
        m2Data.forEach((d, i) => {
            l2.innerHTML += `<div class="nav-btn" onclick="pg('m2-${i}')">Pág ${i+21}: ${d.t}</div>`;
            viewer.innerHTML += `<div id="m2-${i}" class="page">
                <span class="tag">M2: PÁGINA ${i+21}/20</span>
                <h1>${d.t}</h1>
                ${i===4 ? `<div class="multa"><span>R$ 20.000.000,00</span>VALOR MÁXIMO DA MULTA</div>` : `<div class="box"><b>RELATÓRIO ROOT:</b><br><br>${d.c}</div>`}
            </div>`;
        });
    }

    window.pg = (id) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };

    load();
    pg('m1-0');
</script>
</body>
</html>
