<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A. SUPREMACIA v8.7 - SIDNEY ROOT</title>
    <style>
        :root { --blue: #00d9ff; --green: #39ff14; --alert: #ffea00; --red: #ff003c; --bg: #000; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: #000 !important; 
            color: #ccc; 
            font-family: 'Consolas', 'Courier New', monospace; 
            display: flex; 
            flex-direction: column;
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
        }
        
        .header-mobile {
            background: #050505;
            border-bottom: 2px solid var(--blue);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2000;
            height: 60px;
        }

        .btn-menu {
            background: var(--blue);
            color: #000;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 0 10px var(--blue);
        }

        .container {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
            overflow: hidden;
            position: relative;
            background: #000;
        }
        
        .sidebar { 
            width: 300px; 
            border-right: 2px solid var(--blue); 
            padding: 15px; 
            overflow-y: auto; 
            background: #080808;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: 0; top: 0; bottom: 0;
                z-index: 1500;
                transform: translateX(-100%);
                width: 85%;
                box-shadow: 20px 0 50px rgba(0,0,0,1);
            }
            .sidebar.open { transform: translateX(0); }
        }

        .nav-title { color: var(--red); font-size: 0.8rem; font-weight: bold; margin: 20px 0 10px; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 5px; letter-spacing: 1px; }
        .nav-btn { display: block; padding: 16px; color: #888; text-decoration: none; font-size: 0.9rem; border-left: 4px solid transparent; cursor: pointer; margin-bottom: 8px; background: #111; border-radius: 4px; }
        .nav-btn.active { color: var(--blue); border-left-color: var(--blue); background: rgba(0, 217, 255, 0.15); font-weight: bold; }
        
        .main { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            background: #000;
            -webkit-overflow-scrolling: touch;
        }

        .page { display: none; width: 100%; color: #eee; }
        .page.active { display: block; animation: fadeIn 0.3s ease; }
        
        .tag { background: var(--red); color: #fff; padding: 4px 12px; font-size: 0.75rem; font-weight: bold; margin-bottom: 15px; display: inline-block; text-transform: uppercase; }
        h1 { color: var(--blue); font-size: 1.8rem; margin: 10px 0 25px; text-transform: uppercase; line-height: 1.1; border-left: 10px solid var(--blue); padding-left: 15px; }
        
        .box { 
            background: #0a0a0a; 
            border: 1px solid #222; 
            padding: 25px; 
            border-radius: 10px; 
            border-top: 4px solid var(--green);
            margin-bottom: 120px;
        }

        h3 { color: var(--green); margin-bottom: 20px; font-size: 1.1rem; border-bottom: 1px solid #333; padding-bottom: 10px; text-transform: uppercase; }
        p { margin-bottom: 18px; line-height: 1.8; text-align: justify; font-size: 1.1rem; color: #ddd; }
        b { color: var(--alert); font-weight: bold; }
        
        .narrador-status { 
            position: fixed; 
            bottom: 0; left: 0; right: 0;
            background: #050505; 
            border-top: 2px solid var(--blue); 
            padding: 12px; 
            text-align: center;
            font-size: 0.75rem; 
            color: var(--blue);
            z-index: 2001;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #loader { position: fixed; inset: 0; background: #000; z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--blue); }
        .spinner { width: 50px; height: 50px; border: 5px solid #111; border-top-color: var(--blue); border-radius: 50%; animation: spin 1s infinite linear; margin-bottom: 20px; }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div>SISTEMA SIDNEY ROOT v8.7...</div>
    </div>

    <div class="header-mobile">
        <button class="btn-menu" onclick="toggleMenu()">MENU</button>
        <h2 style="color: #fff; font-size: 1rem; letter-spacing: 1px;">S.A. SUPREMACIA</h2>
        <div style="font-size: 0.7rem; color: var(--green); border: 1px solid var(--green); padding: 3px 8px;">ROOT</div>
    </div>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="nav-title">M1: SFN MINUCIOSO</div>
            <div id="m1-links"></div>
            <div class="nav-title">M2: CRIMES FINANCEIROS</div>
            <div id="m2-links"></div>
        </div>
        
        <div class="main" id="content-area"></div>
    </div>

    <div class="narrador-status" id="v-status">SISTEMA DE VOZ: STANDBY</div>

<script>
    const m1Data = [
        { t: "SFN: Arquitetura e Intermediação", c: "O Sistema Financeiro Nacional é o conjunto de instituições que viabilizam o fluxo de dinheiro entre quem poupa e quem investe. A <b>Intermediação Financeira</b> é o coração do sistema: o banco capta dinheiro do poupador (pagando juros baixos) e empresta para o tomador (cobrando juros altos). A diferença é o spread. O SFN é dividido em: <b>Normativo</b> (Conselho Monetário Nacional), <b>Supervisor</b> (Banco Central e CVM) e <b>Operadores</b> (Bancos, Corretoras e Seguradoras)." },
        { t: "CMN: O Conselho de Cúpula", c: "O CMN é o órgão máximo. Ele dita as regras, mas não fiscaliza nem opera. <b>Composição:</b> Ministro da Fazenda, Ministro do Planejamento e Presidente do BACEN. Ele define as metas de inflação, regula a entrada de novos bancos e zelar pela solidez da moeda brasileira. Tudo que for regra 'estratégica' vem do CMN." },
        { t: "BACEN: O Executor da Moeda", c: "O Banco Central é o executor das normas do CMN. Ele tem autonomia. Suas funções são críticas: emitir dinheiro físico, fiscalizar as instituições financeiras, controlar o crédito, gerir as reservas em dólar do Brasil e executar a política monetária para que a inflação fique na meta. É o garantidor da ordem bancária." },
        { t: "CVM: Mercado de Valores", c: "A CVM fiscaliza o mercado de capitais (ações, debêntures, fundos). Seu papel é proteger o investidor de fraudes e garantir que as empresas publiquem balanços verdadeiros. Ela pune o uso de informações privilegiadas e garante que o mercado de bolsa de valores seja justo para todos os participantes." },
        { t: "Selic e Cetip", c: "O <b>Selic</b> é o sistema de custódia de títulos do governo (dívida pública). A <b>Cetip</b> (parte da B3) é onde ficam os títulos de bancos e empresas privadas (CDB, LCI). Esses sistemas garantem que cada papel tenha um dono legítimo e que a troca de dinheiro ocorra sem erros no fim do dia." }
    ];

    const m2Data = [
        { t: "Lavagem de Dinheiro (Lei 9.613)", c: "Crime de transformar dinheiro 'sujo' (crime) em 'limpo' (legal). Pena de 3 a 10 anos. <b>Fases:</b> 1. <b>Colocação</b> (depositar no banco); 2. <b>Ocultação</b> (fazer transferências complexas para esconder a origem); 3. <b>Integração</b> (comprar bens luxuosos ou investir o dinheiro já lavado)." },
        { t: "COAF e Alertas 24h", c: "O COAF recebe denúncias dos bancos sobre movimentações estranhas. O banco tem <b>24 horas</b> para avisar o COAF sobre algo suspeito. Importante: o cliente não pode saber que foi denunciado. A multa para o banco que omite pode chegar a <b>20 Milhões de Reais</b>." },
        { t: "Ética e Insider Trading", c: "<b>Insider Trading:</b> Usar segredo da empresa para ganhar na bolsa antes de todo mundo saber. <b>Front Running:</b> Corretor que opera na frente do cliente para roubar a valorização. São crimes federais que geram expulsão imediata do mercado financeiro e prisão." }
    ];

    const viewer = document.getElementById('content-area');
    const sidebar = document.getElementById('sidebar');
    const vStatus = document.getElementById('v-status');
    const loader = document.getElementById('loader');

    function toggleMenu() { sidebar.classList.toggle('open'); }

    function narrar(texto) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(texto);
        msg.lang = 'pt-BR';
        msg.onstart = () => vStatus.innerHTML = "VOZ: EMITINDO RELATÓRIO...";
        msg.onend = () => vStatus.innerHTML = "VOZ: STANDBY";
        window.speechSynthesis.speak(msg);
    }

    function init() {
        m1Data.forEach((d, i) => {
            document.getElementById('m1-links').innerHTML += `<div class="nav-btn" onclick="pg('m1-${i}')">Pág ${i+1}: ${d.t}</div>`;
            viewer.innerHTML += `<div id="m1-${i}" class="page"><span class="tag">M1: ${i+1}/20</span><h1>${d.t}</h1><div class="box"><h3>RELATÓRIO TÉCNICO:</h3><p>${d.c}</p></div></div>`;
        });
        m2Data.forEach((d, i) => {
            document.getElementById('m2-links').innerHTML += `<div class="nav-btn" onclick="pg('m2-${i}')">Pág ${i+6}: ${d.t}</div>`;
            viewer.innerHTML += `<div id="m2-${i}" class="page"><span class="tag">M2: ${i+6}/40</span><h1>${d.t}</h1><div class="box"><h3>ÉTICA E CRIME:</h3><p>${d.c}</p></div></div>`;
        });
        setTimeout(() => { loader.style.display = 'none'; pg('m1-0'); }, 1000);
    }

    window.pg = (id) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        const target = document.getElementById(id);
        if (target) {
            target.classList.add('active');
            sidebar.classList.remove('open');
            viewer.scrollTop = 0;
            const t = target.querySelector('h1').innerText;
            const c = target.querySelector('.box p').innerText.replace(/<[^>]*>?/gm, '');
            narrar(t + ". " + c);
        }
    };
    window.onload = init;
</script>
</body>
</html>
